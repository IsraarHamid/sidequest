# Local containerised run of the whole stack (backup / parity with prod images).
#   1. cp backend/.env.example backend/.env   # add keys (optional)
#   2. docker compose up --build
#   3. open http://localhost:3000   (API on http://localhost:8000)
# If port 3000 is taken (e.g. by Docker/another app), change "3000:3000" to
# "3001:3000" below and rebuild with NEXT_PUBLIC_API_BASE_URL unchanged.

services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: ./backend/.env
        required: false        # runs on fallbacks if no .env present
    environment:
      - PORT=8000

  frontend:
    build:
      context: ./frontend
      args:
        # Public build-time value; the browser calls the backend at this URL.
        # Must match the host backend port below.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - PORT=3000
    depends_on:
      - backend

  # Public tunnel via ngrok (opt-in). Needs NGROK_AUTHTOKEN in a root `.env`
  # (see .env.example). You get a random https://xxxx.ngrok-free.app URL each run;
  # find it at http://localhost:4040 or `docker compose logs ngrok`.
  #   docker compose --profile tunnel up
  # Defaults to exposing the backend API; set NGROK_TARGET=frontend:3000 for the web app.
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    command: ["http", "${NGROK_TARGET:-backend:8000}"]
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
